[package]
# Cargo-level name has to be distinct from the macOS/Tauri crate that also
# lives in this workspace. The built binary and the installed .deb/.rpm are
# still called `rdpls` via the [[bin]] and metadata overrides below.
name = "rdpls-linux"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Dedicated RDP browser wrapper (Linux build)"
authors = ["Tyler Hays <tyhays@gmail.com>"]
license = ""

[[bin]]
name = "rdpls"
path = "src/main.rs"

[dependencies]
# Alias gtk4/gdk4 as gtk/gdk so the code reads like typical gtk-rs examples
# without every symbol carrying a version suffix.
gtk = { package = "gtk4", version = "0.11" }
gdk = { package = "gdk4", version = "0.11" }
gdk-wayland = { package = "gdk4-wayland", version = "0.11" }
gdk-wayland-sys = { package = "gdk4-wayland-sys", version = "0.11" }
webkit6 = "0.6"
# glib is re-exported from gtk (`use gtk::glib`); no direct pin here to avoid
# pulling a second version into the dep graph.
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["unstable", "client"] }
log = "0.4"
env_logger = "0.11"
once_cell = "1"

[package.metadata.deb]
name = "rdpls"
maintainer = "Tyler Hays <tyhays@gmail.com>"
section = "utils"
priority = "optional"
depends = "libwebkitgtk-6.0-4, libgtk-4-1"
extended-description = "Hosts Microsoft's web-based RDP client (Windows 365 / AVD) in a minimal native WebView with full keyboard passthrough."
assets = [
    ["target/release/rdpls", "usr/bin/", "755"],
    ["assets/rdpls.desktop", "usr/share/applications/", "644"],
    ["../src-tauri/icons/128x128.png", "usr/share/icons/hicolor/128x128/apps/rdpls.png", "644"],
    ["../src-tauri/icons/32x32.png", "usr/share/icons/hicolor/32x32/apps/rdpls.png", "644"],
]

[package.metadata.generate-rpm]
# cargo-generate-rpm 0.20 resolves asset source paths relative to this
# Cargo.toml (not the workspace root like cargo-deb does). The Makefile
# runs `cargo generate-rpm` from inside this directory for that reason.
name = "rdpls"
summary = "Dedicated RDP browser wrapper"
license = "MIT"
assets = [
    { source = "../target/release/rdpls", dest = "/usr/bin/rdpls", mode = "755" },
    { source = "assets/rdpls.desktop", dest = "/usr/share/applications/rdpls.desktop", mode = "644" },
    { source = "../src-tauri/icons/128x128.png", dest = "/usr/share/icons/hicolor/128x128/apps/rdpls.png", mode = "644" },
    { source = "../src-tauri/icons/32x32.png", dest = "/usr/share/icons/hicolor/32x32/apps/rdpls.png", mode = "644" },
]

# Runtime deps are auto-discovered via ldd by cargo-generate-rpm's default
# `--auto-req auto` mode, which picks up libwebkitgtk-6.0.so.4 and libgtk-4.so.1
# from the built binary — no explicit `[requires]` section needed.
